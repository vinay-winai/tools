<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Better Compounding Calculator</title>
    <link rel="stylesheet" href="adv_compounding_calc.css">
</head>
<body>
    <div class="container">
        <h1>A Better Compounding Calculator</h1>
        <div class="calculator">
            <div class="input-section">
                <div class="formula-label">Enter Values:</div>
                <div class="input-group">
                    <div class="input-container">
                        <label for="amount" class="input-label">Amount</label>
                        <div class="input-box">
                            <input type="number" id="amount" min="0" step="any">
                        </div>
                    </div>
                    <div class="input-container">
                        <label for="interest" class="input-label">Gain %</label>
                        <div class="input-box">
                            <input type="number" id="interest" min="0" step="any">
                        </div>
                    </div>
                    <div class="input-container">
                        <label for="frequency" class="input-label">Compounds</label>
                        <div class="input-box">
                            <input type="number" id="frequency" min="0" step="any">
                        </div>
                    </div>
                    <div class="input-container">
                        <label for="years" class="input-label">Periods</label>
                        <div class="input-box">
                            <input type="number" id="years" min="0" step="any" value="1">
                        </div>
                    </div>
                </div>
                <div class="formula-equals">
                    <div class="formula-text"></div>
                </div>
                <div class="deduction-section">
                    <h3>Annual Deductions</h3>
                    <div class="input-group">
                        <div class="input-container">
                            <label for="deduction-percent" class="input-label">Deduction %</label>
                            <div class="input-box">
                                <input type="number" id="deduction-percent" min="0" max="100" step="any" value="0">
                            </div>
                        </div>
                        <div class="input-container">
                            <label for="deduction-amount" class="input-label">Deduction Amount</label>
                            <div class="input-box">
                                <input type="number" id="deduction-amount" min="0" step="any" value="0">
                            </div>
                        </div>
                    </div>
                    <div class="deduction-type-container">
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="deduction-type" id="deduction-type-gains" value="gains" checked>
                                Apply % to gains only
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="deduction-type" id="deduction-type-whole" value="whole">
                                Apply % to whole amount
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="result-container">
                <button id="calculate-btn">Calculate</button>
                <div id="result"></div>
            </div>
        </div>
    </div>

    <div id="data-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Standard Compounding Gain</h2>
            <div id="modal-data-table"></div>
        </div>
    </div>

    <script src="adv_compounding_calc.js"></script>
</body>
</html>
